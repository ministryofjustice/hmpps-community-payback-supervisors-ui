---
# Per environment values which override defaults in hmpps-community-payback-supervisors-ui/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: community-payback-supervisors.hmpps.service.justice.gov.uk
    tlsSecretName: hmpps-community-payback-supervisors-prod-cert

  env:
    LOG_LEVEL: 'info'
    INGRESS_URL: 'https://community-payback-supervisors.hmpps.service.justice.gov.uk'
    HMPPS_AUTH_URL: 'https://sign-in.hmpps.service.justice.gov.uk/auth'
    TOKEN_VERIFICATION_API_URL: 'https://token-verification-api.prison.service.justice.gov.uk'
    COMMUNITY_PAYBACK_API_URL: 'https://community-payback-api.hmpps.service.justice.gov.uk'
    COMPONENT_API_URL: 'https://probation-frontend-components.hmpps.service.justice.gov.uk'
    ENVIRONMENT_NAME: PROD
    AUDIT_ENABLED: 'true'
    DISPLAY_HOURS_DETAILS_ENABLED: 'true'
    UPDATE_APPOINTMENTS_ENABLED: 'false'
    SESSIONS_FILTERS_ENABLED: 'false'
